<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Three Brain Systems: 20x Habits, 5x Impulse, 1x Rational">
  <rect width="720" height="260" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="360" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#121518">THE THREE BRAIN SYSTEMS — RELATIVE RESPONSE SPEED &amp; DRIVE</text>

  <!-- 20x Habit / Autopilot -->
  <rect x="30" y="56" width="204" height="176" rx="12" fill="#FDF2F4" stroke="#7A263A" stroke-width="2"/>
  <text x="132" y="88" text-anchor="middle" font-family="Oswald, sans-serif" font-size="28" font-weight="700" fill="#7A263A">20x</text>
  <text x="132" y="114" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#121518">Autopilot Habit System</text>
  <text x="132" y="138" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#334155">Trained by repetition &amp; cues</text>
  <text x="132" y="156" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#334155">(5pm clock-off, payday, pub door)</text>
  <rect x="52" y="178" width="160" height="34" rx="8" fill="#7A263A"/>
  <text x="132" y="199" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Reprogram via new routines</text>

  <!-- 5x Impulse / Threat -->
  <rect x="258" y="56" width="204" height="176" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="360" y="88" text-anchor="middle" font-family="Oswald, sans-serif" font-size="28" font-weight="700" fill="#DC2626">5x</text>
  <text x="360" y="114" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#121518">Emotional Impulse Engine</text>
  <text x="360" y="138" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#334155">Fires on stress, hunger &amp; fatigue</text>
  <text x="360" y="156" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#334155">Demands fast relief right now</text>
  <rect x="280" y="178" width="160" height="34" rx="8" fill="#DC2626"/>
  <text x="360" y="199" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Nurture first, then steady</text>

  <!-- 1x Rational / Anchor -->
  <rect x="486" y="56" width="204" height="176" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
  <text x="588" y="88" text-anchor="middle" font-family="Oswald, sans-serif" font-size="28" font-weight="700" fill="#0284C7">1x</text>
  <text x="588" y="114" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#121518">Rational Anchor Brain</text>
  <text x="588" y="138" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#334155">Calm values, 7am vision &amp; plans</text>
  <text x="588" y="156" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#334155">Needs a 60s pause to come online</text>
  <rect x="508" y="178" width="160" height="34" rx="8" fill="#0284C7"/>
  <text x="588" y="199" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Give it 60s breathing space</text>
</svg>
