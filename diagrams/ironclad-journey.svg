<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The 4 Safe Release Steps and Anchor Stone Loop">
  <rect width="720" height="220" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="360" y="32" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#121518">THE 4 SAFE RELEASE STEPS — NURTURE FIRST, THEN MANAGE</text>

  <g font-family="Inter, sans-serif">
    <rect x="28" y="58" width="152" height="128" rx="12" fill="#FDF2F4" stroke="#7A263A" stroke-width="2"/>
    <text x="104" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#7A263A">1. NAME IT</text>
    <text x="104" y="108" text-anchor="middle" font-size="11" fill="#121518">Spot the HALT state</text>
    <text x="104" y="126" text-anchor="middle" font-size="10" fill="#475569">Hungry, Angry,</text>
    <text x="104" y="140" text-anchor="middle" font-size="10" fill="#475569">Lonely, or Tired</text>

    <rect x="198" y="58" width="152" height="128" rx="12" fill="#F0F9FF" stroke="#1BB1E7" stroke-width="2"/>
    <text x="274" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#0284C7">2. NURTURE</text>
    <text x="274" y="108" text-anchor="middle" font-size="11" fill="#121518">Calm the body first</text>
    <text x="274" y="126" text-anchor="middle" font-size="10" fill="#475569">Cold water, protein,</text>
    <text x="274" y="140" text-anchor="middle" font-size="10" fill="#475569">60s box breathing</text>

    <rect x="368" y="58" width="152" height="128" rx="12" fill="#F8FAFC" stroke="#7A263A" stroke-width="2"/>
    <text x="444" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#7A263A">3. RELEASE</text>
    <text x="444" y="108" text-anchor="middle" font-size="11" fill="#121518">Discharge tension</text>
    <text x="444" y="126" text-anchor="middle" font-size="10" fill="#475569">20m Move the Iron,</text>
    <text x="444" y="140" text-anchor="middle" font-size="10" fill="#475569">walk, or talk to Pippa</text>

    <rect x="538" y="58" width="152" height="128" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
    <text x="614" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#0284C7">4. ANCHOR</text>
    <text x="614" y="108" text-anchor="middle" font-size="11" fill="#121518">Lock new autopilot</text>
    <text x="614" y="126" text-anchor="middle" font-size="10" fill="#475569">Log win in The Forge,</text>
    <text x="614" y="140" text-anchor="middle" font-size="10" fill="#475569">celebrate 7am strength</text>
  </g>
</svg>
